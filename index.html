  add(s, n) { const d = D.parse(s); d.setUTCDate(d.getUTCDate() + n); return D.fmt(d); },
  dow(s) { return (D.parse(s).getUTCDay() + 6) % 7; },          // 0 = lunedi

  monthEnd(y, m) { return D.fmt(new Date(Date.UTC(y, m, 0))); }, // m 1-based

const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); }));
function hashStr(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; }
function fakeHex(seed, bytes) { let out = '', h = hashStr(seed); for (let i = 0; i < bytes; i++) { h = Math.imul(h ^ (h >>> 15), 2246822507) >>> 0; out += pad((h & 255).toString(16)); } return out; }

const sede = id => DB.sedi.find(x => x.id === +id);

const isAttivo = s => { const i = iscrizioneCorrente(s.id); return i && (!i.al || i.al >= TODAY); };
const isMinore = s => eta(s.nascita) < 18;

/** Tariffa piu specifica valida in una data: sede+percorso > sede > percorso > generale */
function tariffaPer(sedeId, percorsoId, d) {
  const ok = DB.tariffe.filter(t => t.dal <= d && (!t.al || t.al >= d)
    && (t.sedeId === null || t.sedeId === sedeId) && (t.percorsoId === null || t.percorsoId === percorsoId));
  ok.sort((a,b) => ((b.sedeId?2:0)+(b.percorsoId?1:0)) - ((a.sedeId?2:0)+(a.percorsoId?1:0)) || b.dal.localeCompare(a.dal));
  return ok[0] || { prezzo:0 };
}

/** Chi paga: genitore pagatore, oppure l'iscritto stesso se maggiorenne */
function pagatore(stId) {

  if (l) { const g = gen(l.genitoreId); return { nome:`${g.nome} ${g.cognome}`, email:g.email, telefono:g.telefono, ruolo:l.parentela }; }

}

/* ---- Quote: calcolate dalle presenze (ore x prezzo applicato) ---- */
function periodiIscritto(st) {
  const iscs = iscrizioniDi(st.id);
  if (!iscs.length) return [];
  const start = iscs[0].dal;
  const lastEnd = iscs.some(i => !i.al) ? TODAY : iscs.map(i => i.al).sort().pop();
  const out = [];
  if (st.frequenza === 'Mensile') {
    let [y, m] = start.split('-').map(Number);
    for (;;) {
      const dal = `${y}-${pad(m)}-01`;
      if (dal > lastEnd) break;
      const ny = m === 12 ? y + 1 : y, nm = m === 12 ? 1 : m + 1;
      out.push({ tipo:'Mensile', dal, al:D.monthEnd(y, m), scadenza:`${ny}-${pad(nm)}-10` });
      y = ny; m = nm;
    }
  } else {
    for (let dal = D.weekStart(start); dal <= lastEnd; dal = D.add(dal, 7))
      out.push({ tipo:'Settimanale', dal, al:D.add(dal, 6), scadenza:D.add(dal, 13) });
  }
  return out;
}
let _quote = null;
const invalidate = () => { _quote = null; };
function quote() {
  if (_quote) return _quote;
  const res = [];
  for (const st of DB.iscritti) {
    const pres = DB.presenze.filter(p => p.iscrittoId === st.id);
    for (const p of periodiIscritto(st)) {
      const pp = pres.filter(x => x.data >= p.dal && x.data <= p.al);
      const totale = r2(pp.reduce((s, x) => s + x.ore * x.prezzo, 0));
      if (totale === 0) continue;
      const key = `${st.id}|${p.dal}`;
      const pagato = r2(DB.pagamenti.filter(x => x.key === key).reduce((s, x) => s + x.importo, 0));
      const residuo = r2(totale - pagato);
      const inCorso = p.al >= TODAY;
      let stato;
      if (residuo <= 0.004) stato = 'Pagata';
      else if (inCorso) stato = 'In corso';
      else if (p.scadenza < TODAY) stato = 'Scaduta';
      else if (pagato > 0) stato = 'Parziale';
      else stato = 'Da pagare';
      res.push({ ...p, key, iscrittoId:st.id, totale, pagato, residuo, stato, ore:pp.reduce((s,x)=>s+x.ore,0),
                 fattura:DB.fatture[key] || null, pagatore:pagatore(st.id) });
    }
  }
  return (_quote = res);
}
const quotaByKey = k => quote().find(q => q.key === k);
const APERTE = ['Da pagare','Parziale','Scaduta'];
const STATO_CLS = { 'Pagata':'success', 'Da pagare':'warning', 'Parziale':'info', 'Scaduta':'danger', 'In corso':'secondary' };
const PLURALE = { 'Pagata':'pagate', 'Da pagare':'da pagare', 'Parziale':'parziali', 'Scaduta':'scadute', 'In corso':'in corso' };
const badge = s => `<span class="badge rounded-pill text-bg-${STATO_CLS[s] || 'light'}">${esc(s)}</span>`;
function periodo(q) {
  if (q.tipo === 'Mensile') return D.mese(q.dal.slice(0, 7));
  return `Sett. ${D.it(q.dal).slice(0,5)} - ${D.it(q.al)}`;
}

/* ============================ CIFRATURA (WebCrypto) ============================
   Stessa logica del backend descritta nel documento:
   - DEK casuale AES-256-GCM per ogni file, nonce 12 byte
   - DEK protetta ("wrap") con la KEK RSA-OAEP-256
   Nella demo la KEK e generata nel browser. In produzione sta in Azure Key Vault
   e la cifratura avviene sul server .NET, mai nel browser. */
const KMS = {
  kek:null, version:'kek-documenti/' + fakeHex('kek', 3),
  async init() {
    if (!window.crypto || !crypto.subtle) return;
    try {
      this.kek = await crypto.subtle.generateKey({ name:'RSA-OAEP', modulusLength:2048, publicExponent:new Uint8Array([1,0,1]), hash:'SHA-256' }, false, ['wrapKey','unwrapKey']);
    } catch (e) { this.kek = null; }
  }
};
async function encryptFile(buf) {
  const dek = await crypto.subtle.generateKey({ name:'AES-GCM', length:256 }, true, ['encrypt','decrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, dek, buf);
  const wrapped = await crypto.subtle.wrapKey('raw', dek, KMS.kek.publicKey, { name:'RSA-OAEP' });
  const sha = await crypto.subtle.digest('SHA-256', buf);
  return { ct, iv, wrapped, sha };
}
async function decryptFile(doc) {
  const dek = await crypto.subtle.unwrapKey('raw', doc.wrapped, KMS.kek.privateKey, { name:'RSA-OAEP' }, { name:'AES-GCM' }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:doc.iv }, dek, doc.ct);
  const sha = toHex(await crypto.subtle.digest('SHA-256', plain));
  if (sha !== toHex(doc.sha)) throw new Error('Verifica integrita fallita');
  return plain;
}

/* ============================ ISCRITTI ============================ */
function residuoIscritto(id) { return quote().filter(q => q.iscrittoId === id && APERTE.includes(q.stato)).reduce((s, q) => s + q.residuo, 0); }

/* ============================ PRESENZE ============================ */
function lockReason(stId, d) {
  const q = quote().find(x => x.iscrittoId === stId && x.dal <= d && x.al >= d);
  if (!q) return '';
  if (q.fattura) return `Quota già fatturata (${q.fattura}): presenze bloccate`;
  if (q.pagato > 0) return 'Quota con pagamenti registrati: presenze bloccate';
  return '';
}
ROUTES.presenze = () => {
  const sedi = scopeSedi();
  if (!S.presSede || !sedi.includes(S.presSede)) S.presSede = sedi[0];
  const sd = S.presSede, ws = S.presWeek, we = D.add(ws, 6);
  const days = [0,1,2,3,4].map(n => D.add(ws, n));
  const rows = DB.iscrizioni.filter(i => i.sedeId === sd && i.dal <= we && (!i.al || i.al >= ws))
    .map(i => ({ i, s:isc(i.iscrittoId) })).sort((a, b) => nomeIsc(a.s).localeCompare(nomeIsc(b.s)));
  let locked = 0;
  const body = rows.map(({ i, s }) => {
    const cells = days.map(d => {
      if (closed(d)) return `<td class="text-center text-body-tertiary small">Chiuso</td>`;
      if (d < i.dal || (i.al && d > i.al)) return `<td class="text-center text-body-tertiary">-</td>`;
      const p = DB.presenze.find(x => x.iscrittoId === s.id && x.data === d);
      const prezzo = p ? p.prezzo : tariffaPer(sd, i.percorsoId, d).prezzo;
      const lock = lockReason(s.id, d), fut = d > TODAY;
      if (lock) locked++;
      return `<td class="text-center"><div class="d-flex align-items-center justify-content-center gap-1">
        <input type="number" class="form-control form-control-sm pres-input" min="0" max="8" step="0.5" value="${p ? p.ore : ''}" placeholder="0"
          data-s="${s.id}" data-i="${i.id}" data-d="${d}" data-prezzo="${prezzo}" data-orig="${p ? p.ore : 0}" data-plan="${s.giorni.includes(D.dow(d)) ? s.ore : 0}"
          ${lock || fut ? 'disabled' : ''} title="${esc(lock || (fut ? 'Giorno futuro' : `Tariffa ${eur(prezzo)}/ora`))}" oninput="App.presCalc()" aria-label="Ore ${esc(nomeIsc(s))} ${D.it(d)}">
        ${lock ? '<i class="bi bi-lock-fill text-body-tertiary small"></i>' : ''}</div></td>`;
    }).join('');
    return `<tr data-row><td><a href="#/iscritto/${s.id}" class="text-decoration-none fw-semibold">${esc(nomeIsc(s))}</a><div class="small text-body-secondary">${esc(perc(i.percorsoId).nome)}</div></td>${cells}
      <td class="text-end" data-ore></td><td class="text-end fw-semibold" data-imp></td></tr>`;
  }).join('');
  S.after = () => App.presCalc();
  const tg = tariffaPer(sd, 1, TODAY).prezzo, ti = tariffaPer(sd, 2, TODAY).prezzo;
  return header('Presenze', `<button class="btn btn-outline-secondary btn-sm" onclick="App.presPrevisto()"><i class="bi bi-magic"></i> Compila come previsto</button>
      <button class="btn btn-brand btn-sm" onclick="App.presSalva()"><i class="bi bi-check2"></i> Salva presenze</button>`) + `
  <div class="card"><div class="card-body">
    <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
      <div class="btn-group btn-group-sm">
        <button class="btn btn-outline-primary" onclick="App.presWeek(-7)" aria-label="Settimana precedente"><i class="bi bi-chevron-left"></i></button>
        <button class="btn btn-outline-primary" onclick="App.presWeek(0)">Oggi</button>
        <button class="btn btn-outline-primary" onclick="App.presWeek(7)" aria-label="Settimana successiva"><i class="bi bi-chevron-right"></i></button>
      </div>
      <span class="fw-semibold">Settimana ${D.it(ws)} - ${D.it(D.add(ws, 4))}</span>
      <select class="form-select form-select-sm w-auto ms-md-auto" onchange="App.presSede(this.value)" ${S.sede ? 'disabled' : ''}>
        ${sedi.map(id => `<option value="${id}" ${id === sd ? 'selected' : ''}>Sede: ${esc(sede(id).nome)}</option>`).join('')}</select>
    </div>
    ${rows.length ? `<div class="table-responsive"><table class="table align-middle mb-0">
      <thead class="table-light"><tr><th>Iscritto</th>${days.map(d => `<th class="text-center ${d === TODAY ? 'text-primary' : ''}">${GG[D.dow(d)]} ${d.slice(8)}</th>`).join('')}<th class="text-end">Ore</th><th class="text-end">Importo</th></tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr class="table-light fw-bold"><td>Totale</td><td colspan="5"></td><td class="text-end" id="totOre"></td><td class="text-end" id="totImp"></td></tr></tfoot>
    </table></div>` : '<p class="text-body-secondary">Nessun iscritto in questa sede per la settimana selezionata.</p>'}
    <div class="small text-body-secondary mt-3">
      Tariffe in vigore oggi a ${esc(sede(sd).nome)}: Base ${eur(tg)}/ora, Intensivo ${eur(ti)}/ora.
      Ogni presenza salva il prezzo applicato: se la tariffa cambia, i totali passati restano invariati.
      ${locked ? `<br><i class="bi bi-lock-fill"></i> Le celle con il lucchetto appartengono a quote già pagate o fatturate e non sono modificabili.` : ''}
    </div>
  </div></div>`;
};

/* ============================ QUOTE ============================ */
function quoteTable(list, compact = false) {
  if (!list.length) return '<p class="text-body-secondary mb-0">Nessuna quota.</p>';
  return `<div class="table-responsive"><table class="table table-sm align-middle mb-0">
    <thead class="table-light"><tr>${compact ? '' : '<th>Iscritto / pagatore</th>'}<th>Tipo</th><th>Periodo</th><th class="text-end">Totale</th><th class="text-end">Pagato</th><th class="text-end">Residuo</th><th>Scadenza</th><th>Stato</th><th>Fattura</th><th class="text-end">Azioni</th></tr></thead>
    <tbody>${list.map(q => { const s = isc(q.iscrittoId); return `<tr>
      ${compact ? '' : `<td><a href="#/iscritto/${s.id}" class="fw-semibold text-decoration-none">${esc(nomeIsc(s))}</a><div class="small text-body-secondary">${esc(q.pagatore.nome)}</div></td>`}
      <td class="small">${q.tipo}</td><td>${periodo(q)}</td><td class="text-end">${eur(q.totale)}</td><td class="text-end">${eur(q.pagato)}</td>
      <td class="text-end fw-semibold">${eur(q.residuo)}</td><td>${D.it(q.scadenza)}</td><td>${badge(q.stato)}</td>
      <td class="small">${q.fattura ? `<i class="bi bi-receipt"></i> ${esc(q.fattura)}` : '<span class="text-body-tertiary">-</span>'}</td>
      <td class="text-end text-nowrap">${quoteActions(q)}</td></tr>`; }).join('')}</tbody></table></div>`;
}
function quoteActions(q) {
  const b = [];
  if (q.residuo > 0.004) b.push(`<button class="btn btn-sm btn-outline-primary" title="Registra pagamento" onclick="App.pagamento('${q.key}')"><i class="bi bi-cash"></i></button>`);
  if (q.residuo > 0.004 && q.stato !== 'In corso') b.push(`<button class="btn btn-sm btn-outline-warning" title="Invia sollecito" onclick="App.sollecito('${q.key}')"><i class="bi bi-send"></i></button>`);
  b.push(`<button class="btn btn-sm btn-outline-secondary" title="Dettaglio" onclick="App.dettaglioQuota('${q.key}')"><i class="bi bi-eye"></i></button>`);
  return `<div class="btn-group">${b.join('')}</div>`;
}
ROUTES.quote = () => {
  const f = S.quoteFiltro, txt = f.q.trim().toLowerCase();
  const ids = new Set(DB.iscritti.filter(inScope).map(s => s.id));
  const all = quote().filter(q => ids.has(q.iscrittoId));
  let list = all;
  const count = st => all.filter(q => st === 'aperte' ? APERTE.includes(q.stato) : st === 'tutte' || q.stato === st).length;
  const pills = [['aperte','Aperte'],['Scaduta','Scadute'],['In corso','In corso'],['Pagata','Pagate'],['tutte','Tutte']];
  list = list.filter(q => f.stato === 'tutte' || (f.stato === 'aperte' ? APERTE.includes(q.stato) : q.stato === f.stato))
    .filter(q => !f.tipo || q.tipo === f.tipo)
    .filter(q => !txt || `${nomeIsc(isc(q.iscrittoId))} ${q.pagatore.nome}`.toLowerCase().includes(txt));
  list.sort((a, b) => f.stato === 'Pagata' || f.stato === 'tutte' ? b.dal.localeCompare(a.dal) : a.scadenza.localeCompare(b.scadenza));
  const PS = 20, pages = Math.max(1, Math.ceil(list.length / PS));

ROUTES.calendario = () => {
  const { y, m } = S.cal;
  const first = `${y}-${pad(m)}-01`, last = D.monthEnd(y, m);
  const start = D.weekStart(first), end = D.add(D.weekStart(last), 6);
  const ids = new Set(DB.iscritti.filter(inScope).map(s => s.id));
  const qs = quote().filter(q => ids.has(q.iscrittoId));
  const byDay = {};
  qs.forEach(q => { (byDay[q.scadenza] = byDay[q.scadenza] || []).push(q); });
  let cells = '';
  for (let d = start; d <= end; d = D.add(d, 1)) {
    const ev = byDay[d] || [], out = d.slice(0, 7) !== `${y}-${pad(m)}`;
    const grp = {};
    ev.forEach(q => { grp[q.stato] = (grp[q.stato] || 0) + 1; });
    const res = ev.reduce((s, q) => s + q.residuo, 0);
    cells += `<div class="cal-day ${out ? 'out' : ''} ${d === TODAY ? 'today' : ''} ${ev.length ? 'has' : ''}" ${ev.length ? `onclick="App.calGiorno('${d}')" role="button" tabindex="0"` : ''}>
      <span class="num">${+d.slice(8)}</span>
      ${Object.entries(grp).map(([st, n]) => `<span class="badge text-bg-${STATO_CLS[st]}" title="${n} ${st.toLowerCase()}">${n}<span class="d-none d-md-inline"> ${n > 1 ? PLURALE[st] : st.toLowerCase()}</span></span>`).join('')}
      ${res > 0 ? `<div class="small text-body-secondary mt-1 d-none d-sm-block">${eur(res)}</div>` : ''}</div>`;
  }
  const mq = qs.filter(q => q.scadenza.startsWith(`${y}-${pad(m)}`));
  const sum = st => mq.filter(q => q.stato === st);
  return header(`Calendario scadenze`, `<div class="btn-group btn-group-sm">
      <button class="btn btn-outline-primary" onclick="App.calMove(-1)" aria-label="Mese precedente"><i class="bi bi-chevron-left"></i></button>
      <button class="btn btn-outline-primary" onclick="App.calMove(0)">Oggi</button>
      <button class="btn btn-outline-primary" onclick="App.calMove(1)" aria-label="Mese successivo"><i class="bi bi-chevron-right"></i></button></div>`, `${cap(MESI[m - 1])} ${y} - ${esc(scopeLabel())}`) + `
  <div class="row g-3">
    <div class="col-xl-9"><div class="card"><div class="card-body">
      <div class="cal-grid mb-1">${GG.map(g => `<div class="cal-head">${g}</div>`).join('')}</div>
      <div class="cal-grid">${cells}</div>
      <div class="d-flex flex-wrap gap-2 mt-3 small align-items-center">${Object.keys(STATO_CLS).map(s => badge(s)).join('')}<span class="text-body-secondary">Clic su un giorno per vedere le quote e inviare i solleciti.</span></div>
    </div></div></div>
    <div class="col-xl-3"><div class="card"><div class="card-body">
      <h2 class="h6 text-brand fw-bold">Scadenze del mese</h2>
      ${['Scaduta','Da pagare','Parziale','In corso','Pagata'].map(st => { const l = sum(st); return `<div class="d-flex justify-content-between align-items-center py-2 border-bottom small">
        <span>${badge(st)} <span class="ms-1">${l.length}</span></span><b>${eur(l.reduce((s, q) => s + (st === 'Pagata' ? q.totale : q.residuo), 0))}</b></div>`; }).join('')}
      <div class="small text-body-secondary mt-2">Le quote mensili scadono il 10 del mese successivo; le settimanali la domenica della settimana dopo.</div>
    </div></div></div>
  </div>`;
};

/* ============================ REPORT ============================ */
function mesiDisponibili() { const out = []; for (let d = '2026-03-01'; d <= TODAY; ) { out.push(d.slice(0, 7)); const [y, m] = d.split('-').map(Number); d = m === 12 ? `${y + 1}-01-01` : `${y}-${pad(m + 1)}-01`; } return out.reverse(); }
function reportData() {
  const r = S.rep, sedi = r.sede ? [r.sede] : scopeSedi();
  const sts = DB.iscritti.filter(s => sedi.includes(iscrizioneCorrente(s.id).sedeId));
  const ids = new Set(sts.map(s => s.id));
  if (r.tipo === 'quote') {
    let qs = quote().filter(q => ids.has(q.iscrittoId) && q.dal.startsWith(r.mese));
    if (r.stato === 'aperte') qs = qs.filter(q => APERTE.includes(q.stato) || q.stato === 'In corso');
    else if (r.stato) qs = qs.filter(q => q.stato === r.stato);
    qs.sort((a, b) => nomeIsc(isc(a.iscrittoId)).localeCompare(nomeIsc(isc(b.iscrittoId))) || a.dal.localeCompare(b.dal));
    const head = ['Iscritto','Pagatore','Periodo','Ore','Totale','Pagato','Residuo','Stato','Fattura'];
    const rows = qs.map(q => [nomeIsc(isc(q.iscrittoId)), q.pagatore.nome, periodo(q), fnum(q.ore), eur(q.totale), eur(q.pagato), eur(q.residuo), q.stato, q.fattura || '']);
    const tot = ['Totale', '', `${qs.length} quote`, fnum(qs.reduce((s, q) => s + q.ore, 0)), eur(qs.reduce((s, q) => s + q.totale, 0)), eur(qs.reduce((s, q) => s + q.pagato, 0)), eur(qs.reduce((s, q) => s + q.residuo, 0)), '', ''];
    return { title:'Elenco quote', head, rows, tot, right:[3,4,5,6] };
  }
  if (r.tipo === 'sede') {
    const rows = sedi.map(id => {
      const pr = DB.presenze.filter(p => p.sedeId === id && p.data.startsWith(r.mese));
      const sIds = new Set(DB.iscritti.filter(s => iscrizioneCorrente(s.id).sedeId === id).map(s => s.id));
      const att = DB.iscritti.filter(s => sIds.has(s.id) && isAttivo(s)).length;
      const inc = DB.pagamenti.filter(p => sIds.has(p.iscrittoId) && p.data.startsWith(r.mese)).reduce((s, p) => s + p.importo, 0);
      const resid = quote().filter(q => sIds.has(q.iscrittoId) && APERTE.includes(q.stato)).reduce((s, q) => s + q.residuo, 0);
      return { n:sede(id).nome, att, ore:pr.reduce((s, p) => s + p.ore, 0), mat:pr.reduce((s, p) => s + p.ore * p.prezzo, 0), inc, resid };
    });
    const sum = k => rows.reduce((s, x) => s + x[k], 0);
    return { title:'Riepilogo per sede', head:['Sede','Iscritti attivi','Ore erogate','Maturato nel mese','Incassato nel mese','Residuo aperto (oggi)'],
      rows:rows.map(x => [x.n, x.att, fnum(x.ore), eur(x.mat), eur(x.inc), eur(x.resid)]),
      tot:['Totale', sum('att'), fnum(sum('ore')), eur(sum('mat')), eur(sum('inc')), eur(sum('resid'))], right:[1,2,3,4,5] };
  }
  const pr = DB.presenze.filter(p => ids.has(p.iscrittoId) && sedi.includes(p.sedeId) && p.data.startsWith(r.mese))
    .sort((a, b) => nomeIsc(isc(a.iscrittoId)).localeCompare(nomeIsc(isc(b.iscrittoId))) || a.data.localeCompare(b.data));
  return { title:'Dettaglio presenze', head:['Iscritto','Data','Sede','Ore','Prezzo orario','Importo'],
    rows:pr.map(p => [nomeIsc(isc(p.iscrittoId)), `${GG[D.dow(p.data)]} ${D.it(p.data)}`, sede(p.sedeId).nome, fnum(p.ore), eur(p.prezzo), eur(p.ore * p.prezzo)]),
    tot:['Totale', `${pr.length} presenze`, '', fnum(pr.reduce((s, p) => s + p.ore, 0)), '', eur(pr.reduce((s, p) => s + p.ore * p.prezzo, 0))], right:[3,4,5] };
}

        </div>

          <thead class="table-light"><tr>${data.head.map((h, i) => `<th class="${data.right.includes(i) ? 'text-end' : ''}">${h}</th>`).join('')}</tr></thead>

          <tfoot><tr class="table-light fw-bold">${data.tot.map((c, i) => `<td class="${data.right.includes(i) ? 'text-end' : ''}">${esc(c)}</td>`).join('')}</tr></tfoot>

        <div class="col-6 col-md-3"><select class="form-select form-select-sm" onchange="App.auditFiltro('user', this.value)"><option value="">Tutti gli utenti</option>${users.map(u => `<option ${f.user === u ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select></div>
        <div class="col-6 col-md-3"><select class="form-select form-select-sm" onchange="App.auditFiltro('azione', this.value)"><option value="">Tutte le azioni</option>${azioni.map(a => `<option ${f.azione === a ? 'selected' : ''}>${esc(a)}</option>`).join('')}</select></div>
      </div>
      <div class="table-responsive"><table class="table table-sm small align-middle"><thead class="table-light"><tr><th>Data e ora</th><th>Utente</th><th>Azione</th><th>Oggetto</th><th>Sede</th></tr></thead>
      <tbody>${list.map(a => `<tr><td class="text-nowrap">${D.it(a.ts)} ${a.ts.slice(11, 16)}</td><td>${esc(a.user)}</td><td><span class="badge text-bg-light border">${esc(a.azione)}</span></td><td>${esc(a.oggetto)}</td><td>${a.sedeId ? esc(sede(a.sedeId).nome) : '-'}</td></tr>`).join('')}</tbody></table></div>
      <div class="small text-body-secondary">Nel prodotto finale il registro non è modificabile e non contiene contenuti sensibili.</div>`;
  }
  return header('Utenti e sedi', '', 'Sezione riservata all\'amministratore') + `
  <ul class="nav nav-tabs">${tabs.map(([k, l]) => `<li class="nav-item"><button class="nav-link ${t === k ? 'active' : ''}" onclick="App.adminTab('${k}')">${l}</button></li>`).join('')}</ul>
  <div class="card border-top-0 rounded-top-0"><div class="card-body">${body}</div></div>`;
};

      <div class="col-md-6"><label class="form-label small">Percorso</label><select class="form-select" id="t_perc">${DB.percorsi.map(p => `<option value="${p.id}" ${p.id === i.percorsoId ? 'selected' : ''}>${esc(p.nome)}</option>`).join('')}</select></div>

    if (DB.presenze.some(p => p.iscrittoId === sid && p.data >= dal)) return formErr('Esistono presenze registrate dopo questa data.');

    i.al = al; i.motivo = $('#c_mot').value;

  // ---- Presenze
  presWeek(n) { S.presWeek = n === 0 ? D.weekStart(TODAY) : D.add(S.presWeek, n); renderMain(); },
  presSede(v) { S.presSede = +v; renderMain(); },
  presCalc() {
    let to = 0, ti = 0;
    document.querySelectorAll('tr[data-row]').forEach(tr => {
      let o = 0, imp = 0;
      tr.querySelectorAll('input.pres-input').forEach(inp => {
        const h = Math.max(0, parseFloat(inp.value) || 0);
        o += h; imp += h * +inp.dataset.prezzo;
        inp.classList.toggle('changed', h !== +inp.dataset.orig);
      });
      tr.querySelector('[data-ore]').textContent = fnum(o);
      tr.querySelector('[data-imp]').textContent = eur(imp);
      to += o; ti += imp;
    });
    if ($('#totOre')) { $('#totOre').textContent = fnum(to); $('#totImp').textContent = eur(ti); }
  },
  presPrevisto() {
    let n = 0;

  presSalva() {
    const inputs = [...document.querySelectorAll('input.pres-input:not([disabled])')];
    for (const inp of inputs) {
      const h = parseFloat(inp.value) || 0;
      if (h < 0 || h > 8 || Math.round(h * 2) !== h * 2) { inp.focus(); toast('Le ore devono essere tra 0 e 8, a passi di mezz\'ora.', 'danger'); return; }
    }
    let n = 0;
    for (const inp of inputs) {
      const h = parseFloat(inp.value) || 0, orig = +inp.dataset.orig;
      if (h === orig) continue;
      const sid = +inp.dataset.s, d = inp.dataset.d;
      const ex = DB.presenze.find(p => p.iscrittoId === sid && p.data === d);
      if (h > 0 && ex) ex.ore = h;
      else if (h > 0) { const i = DB.iscrizioni.find(x => x.id === +inp.dataset.i); DB.presenze.push({ id:nextId('presenza'), iscrittoId:sid, iscrizioneId:i.id, sedeId:i.sedeId, data:d, ore:h, prezzo:+inp.dataset.prezzo }); }
      else if (ex) DB.presenze.splice(DB.presenze.indexOf(ex), 1);
      n++;
    }
    if (!n) { toast('Nessuna modifica da salvare.', 'secondary'); return; }
    audit('Presenze', `${n} modifiche, settimana ${D.it(S.presWeek)}`, S.presSede);
    invalidate(); toast(`Salvate ${n} modifiche. Le quote sono state ricalcolate.`); renderMain();

  upload(sid) {
    if (!KMS.kek) { openModal('Cifratura non disponibile', '<p class="small mb-0">Questo browser non mette a disposizione la cifratura WebCrypto (serve una pagina aperta in modo sicuro, ad esempio da file locale o https). Il resto della demo funziona normalmente.</p>'); return; }
    const sts = DB.iscritti.filter(s => inScope(s) && isAttivo(s)).sort((a, b) => nomeIsc(a).localeCompare(nomeIsc(b)));
    openModal('Carica documento', `<form id="fUp" class="row g-2" onsubmit="event.preventDefault(); App.eseguiUpload()">
      <div class="col-md-6"><label class="form-label small">Iscritto</label><select class="form-select" id="u_isc" ${sid ? 'disabled' : ''}>${sts.map(s => `<option value="${s.id}" ${s.id === sid ? 'selected' : ''}>${esc(nomeIsc(s))}</option>`).join('')}</select></div>
      <div class="col-md-6"><label class="form-label small">Categoria</label><select class="form-select" id="u_cat">${CATEGORIE.map(c => `<option>${c}</option>`).join('')}</select></div>
      <div class="col-12"><label class="form-label small">File (PDF, JPG o PNG, massimo 20 MB)</label><input type="file" class="form-control" id="u_file" accept=".pdf,.jpg,.jpeg,.png,application/pdf,image/jpeg,image/png" required></div>
      <div class="col-12 small text-body-secondary">Prova con un file qualsiasi non riservato. Il file resta solo nel tuo browser.</div>
      <div class="col-12"><ul class="list-unstyled small step-list mb-0" id="u_steps"></ul></div>
      <div class="col-12"><div id="formErr" class="alert alert-danger small py-2 d-none"></div></div></form>`,
      `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Annulla</button><button class="btn btn-brand" type="submit" form="fUp" id="u_btn"><i class="bi bi-lock"></i> Cifra e carica</button>`);
  },
  async eseguiUpload() {
    const f = $('#u_file').files[0];
    if (!f) return formErr('Scegli un file.');
    if (f.size > 20 * 1048576) return formErr('Il file supera 20 MB.');
    const okType = /\.(pdf|jpe?g|png)$/i.test(f.name);
    if (!okType) return formErr('Formato non ammesso: solo PDF, JPG o PNG.');
    $('#u_btn').disabled = true;
    const ul = $('#u_steps');
    const step = async (txt, fn) => {
      const li = document.createElement('li');
      li.innerHTML = `<span class="spinner-border spinner-border-sm text-primary me-2"></span>${txt}`;
      ul.appendChild(li);
      const r = await fn();
      await new Promise(res => setTimeout(res, 280));
      li.innerHTML = `<i class="bi bi-check-circle-fill text-success me-2"></i>${txt}`;
      return r;
    };
    try {
      const buf = await step('Lettura del file', () => f.arrayBuffer());
      const enc = await step('Cifratura AES-256-GCM con chiave nuova (DEK) e nonce da 12 byte', () => encryptFile(buf));
      await step(`Protezione della DEK con la chiave principale (KEK ${KMS.version}) - in produzione: Azure Key Vault`, async () => {});
      await step('Calcolo SHA-256 per la verifica di integrità', async () => {});
      const blobName = uuid();
      await step(`Salvataggio del file cifrato come ${blobName.slice(0, 8)}... e dei metadati nel database`, async () => {});
      const sid = +$('#u_isc').value;
      const type = f.type || (/\.pdf$/i.test(f.name) ? 'application/pdf' : 'image/jpeg');
      DB.documenti.push({ id:nextId('documento'), iscrittoId:sid, nome:f.name, categoria:$('#u_cat').value, data:TODAY, by:userName(), size:f.size, type,
        blobName, kek:KMS.version, ct:enc.ct, iv:enc.iv, wrapped:enc.wrapped, sha:enc.sha });
      audit('Upload documento', `${f.name} (${nomeIsc(isc(sid))})`, iscrizioneCorrente(sid).sedeId);
      setTimeout(() => { closeModal(); toast('Documento cifrato e caricato'); renderMain(); }, 400);
    } catch (e) {
      formErr('Errore durante la cifratura: ' + e.message); $('#u_btn').disabled = false;
    }
  },
  async apriDoc(id) {
    const d = DB.documenti.find(x => x.id === id), s = isc(d.iscrittoId);
    audit('Apertura documento', `${d.nome} (${nomeIsc(s)})`, iscrizioneCorrente(s.id).sedeId);
    if (d.demo) {
      openModal(esc(d.nome), `<div class="text-center py-4"><i class="bi bi-file-earmark-lock display-4 text-secondary"></i>
        <p class="mt-3 mb-1">Documento di esempio: nella demo i file precaricati hanno solo i metadati.</p>
        <p class="small text-body-secondary">Carica un tuo file per vedere la decifratura reale. L'apertura è stata comunque registrata nel registro accessi.</p></div>`);
      return;
    }
    try {
      const plain = await decryptFile(d);
      const url = URL.createObjectURL(new Blob([plain], { type:d.type }));
      const view = d.type.startsWith('image') ? `<img src="${url}" class="img-fluid rounded border" alt="${esc(d.nome)}">` : `<iframe src="${url}" style="width:100%;height:70vh;border:1px solid #dee2e6;border-radius:6px" title="${esc(d.nome)}"></iframe>`;
      openModal(`<i class="bi bi-unlock"></i> ${esc(d.nome)}`, `<div class="alert alert-success small py-2"><i class="bi bi-check-circle"></i> Decifrato in memoria e integrità verificata (SHA-256). Nessuna copia in chiaro viene salvata.</div>${view}`, '', 'modal-xl');
    } catch (e) { toast('Impossibile decifrare: ' + esc(e.message), 'danger'); }
  },
  async scaricaDoc(id) {
    const d = DB.documenti.find(x => x.id === id), s = isc(d.iscrittoId);
    audit('Download documento', `${d.nome} (${nomeIsc(s)})`, iscrizioneCorrente(s.id).sedeId);
    if (d.demo) { toast('Documento di esempio senza contenuto: download registrato nel registro accessi.', 'secondary'); return; }
    try {
      const plain = await decryptFile(d);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([plain], { type:d.type })); a.download = d.nome;
      document.body.appendChild(a); a.click(); a.remove();
      toast('Download avviato');
    } catch (e) { toast('Impossibile decifrare: ' + esc(e.message), 'danger'); }
  },
  techDoc(id) {
    const d = DB.documenti.find(x => x.id === id);
    let dek, nonce, tag, sha, first;
    if (d.demo) { dek = fakeHex(d.blobName + 'k', 32) + '...'; nonce = fakeHex(d.blobName + 'n', 12); tag = fakeHex(d.blobName + 't', 16); sha = fakeHex(d.blobName + 's', 32); first = fakeHex(d.blobName + 'c', 32) + '...'; }
    else { const ct = new Uint8Array(d.ct); dek = toHex(d.wrapped).slice(0, 64) + '... (' + d.wrapped.byteLength + ' byte)'; nonce = toHex(d.iv); tag = toHex(ct.slice(-16)); sha = toHex(d.sha); first = toHex(ct.slice(0, 32)) + '...'; }
    const row = (k, v) => `<tr><th class="small text-nowrap">${k}</th><td class="hex">${esc(v)}</td></tr>`;
    openModal('Dettagli di cifratura', `<p class="small text-body-secondary">Questi sono i metadati che il database conserva accanto al documento. Senza la chiave principale nel Key Vault, il file e la DEK cifrata sono illeggibili.</p>
      <table class="table table-sm"><tbody>
      ${row('Nome blob', d.blobName)}${row('Nome originale', d.nome + ' (solo nel database)')}${row('Algoritmo file', 'AES-256-GCM')}${row('Chiave principale', d.kek + ' (RSA-OAEP-256)')}
      ${row('DEK cifrata', dek)}${row('Nonce (12 byte)', nonce)}${row('Tag (16 byte)', tag)}${row('SHA-256 originale', sha)}${row('Primi byte del file cifrato', first)}
      </tbody></table>${d.demo ? '<p class="small text-body-secondary mb-0">Documento di esempio: valori simulati.</p>' : '<p class="small text-success mb-0"><i class="bi bi-check-circle"></i> Valori reali prodotti dalla cifratura di questo file.</p>'}`, '', 'modal-lg');
  },
  eliminaDoc(id) {
    const d = DB.documenti.find(x => x.id === id);
    openModal('Eliminare il documento?', `<p class="mb-1">${esc(d.nome)}</p><p class="small text-body-secondary mb-0">Cancellazione logica: il documento non sarà più visibile e l'operazione viene registrata.</p>`,
      `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Annulla</button><button class="btn btn-danger" onclick="App.confermaElimina(${id})">Elimina</button>`);
  },

    audit('Eliminazione documento', `${d.nome} (${nomeIsc(isc(d.iscrittoId))})`); closeModal(); toast('Documento eliminato'); renderMain();

  csv() {
    const d = reportData();
    const cell = c => `"${String(c).replace(/"/g, '""')}"`;
    const lines = [d.head, ...d.rows, d.tot].map(r => r.map(cell).join(';'));
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `report-${S.rep.tipo}-${S.rep.mese}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    audit('Esportazione', `CSV ${S.rep.tipo} ${S.rep.mese}`); toast('File CSV scaricato (si apre con Excel)');
  },

  // ---- Admin
  adminTab(t) { S.adminTab = t; renderMain(); },
  auditFiltro(k, v) { S.auditFiltro[k] = v; renderMain(); },
  utente(id) {
    const u = id ? DB.utenti.find(x => x.id === id) : { nome:'', cognome:'', email:'', ruolo:'Segreteria', sedi:[], attivo:true };
    openModal(id ? 'Modifica utente' : 'Nuovo utente', `<form id="fUt" class="row g-2" onsubmit="event.preventDefault(); App.salvaUtente(${id || 0})">
      ${id ? '' : `<div class="col-12"><div class="alert alert-secondary small py-2"><b>Versione 1:</b> crea prima l'account nel portale Azure (Entra ID), poi autorizzalo qui con ruolo e sedi.</div></div>`}
      <div class="col-md-6"><label class="form-label small">Nome</label><input class="form-control" id="u_nome" value="${esc(u.nome)}" required></div>
      <div class="col-md-6"><label class="form-label small">Cognome</label><input class="form-control" id="u_cognome" value="${esc(u.cognome)}" required></div>
      <div class="col-12"><label class="form-label small">Email dell'account Microsoft</label><input type="email" class="form-control" id="u_email" value="${esc(u.email)}" ${id ? 'readonly' : ''} required placeholder="nome@struttura.onmicrosoft.com"></div>
      <div class="col-md-6"><label class="form-label small">Ruolo</label><select class="form-select" id="u_ruolo" onchange="App.utRuolo()" ${id === S.user.id ? 'disabled' : ''}>
        ${['Segreteria','Amministratore'].map(r => `<option ${u.ruolo === r ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
      <div class="col-md-6"><label class="form-label small">Sedi accessibili</label><div id="u_sedi">${DB.sedi.map(s => `<div class="form-check"><input class="form-check-input" type="checkbox" value="${s.id}" id="us${s.id}" ${u.sedi.includes(s.id) ? 'checked' : ''}><label class="form-check-label small" for="us${s.id}">${esc(s.nome)}</label></div>`).join('')}</div></div>
      <div class="col-12"><div id="formErr" class="alert alert-danger small py-2 d-none"></div></div></form>`,
      `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Annulla</button><button class="btn btn-brand" type="submit" form="fUt">Salva</button>`);
    App.utRuolo();
  },
  utRuolo() { const adm = $('#u_ruolo').value === 'Amministratore'; document.querySelectorAll('#u_sedi input').forEach(c => { c.disabled = adm; if (adm) c.checked = true; }); },
  salvaUtente(id) {
    const v = k => ($(k).value || '').trim();
    const sedi = [...document.querySelectorAll('#u_sedi input:checked')].map(c => +c.value);
    const ruolo = v('#u_ruolo'), email = v('#u_email').toLowerCase();
    if (!v('#u_nome') || !v('#u_cognome')) return formErr('Nome e cognome sono obbligatori.');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return formErr('Email non valida.');
    if (!id && DB.utenti.some(u => u.email === email)) return formErr('Utente già presente.');
    if (ruolo !== 'Amministratore' && !sedi.length) return formErr('Assegna almeno una sede.');
    if (id) { Object.assign(DB.utenti.find(u => u.id === id), { nome:v('#u_nome'), cognome:v('#u_cognome'), ruolo, sedi:ruolo === 'Amministratore' ? DB.sedi.map(s => s.id) : sedi }); audit('Modifica utente', email); }
    else { DB.utenti.push({ id:nextId('utente'), nome:v('#u_nome'), cognome:v('#u_cognome'), email, ruolo, sedi:ruolo === 'Amministratore' ? DB.sedi.map(s => s.id) : sedi, attivo:true, oid:uuid() }); audit('Creazione utente', email); }
    closeModal(); toast('Utente salvato'); renderMain();
  },
  toggleUtente(id) { const u = DB.utenti.find(x => x.id === id); u.attivo = !u.attivo; audit(u.attivo ? 'Attivazione utente' : 'Disattivazione utente', u.email); toast(u.attivo ? 'Utente attivato' : 'Utente disattivato'); renderMain(); },
  nuovaSede() {
    openModal('Nuova sede', `<form id="fSe" class="row g-2" onsubmit="event.preventDefault(); App.salvaSede()">
      <div class="col-12"><label class="form-label small">Nome</label><input class="form-control" id="se_nome" required></div>
      <div class="col-12"><label class="form-label small">Indirizzo</label><input class="form-control" id="se_ind"></div>
      <div class="col-12"><div id="formErr" class="alert alert-danger small py-2 d-none"></div></div></form>`,
      `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Annulla</button><button class="btn btn-brand" type="submit" form="fSe">Salva</button>`);
  },
  salvaSede() {
    const n = $('#se_nome').value.trim();
    if (!n) return formErr('Indica il nome.');
    if (DB.sedi.some(s => s.nome.toLowerCase() === n.toLowerCase())) return formErr('Esiste già una sede con questo nome.');
    const id = nextId('sede'); DB.sedi.push({ id, nome:n, indirizzo:$('#se_ind').value.trim(), attiva:true });
    DB.utenti.filter(u => u.ruolo === 'Amministratore').forEach(u => u.sedi.push(id));
    audit('Creazione sede', n); closeModal(); $('#sedeSel').innerHTML = sedeOptions(); toast('Sede creata'); renderMain();
  },
  nuovaTariffa() {
    openModal('Nuova tariffa', `<form id="fTa" class="row g-2" onsubmit="event.preventDefault(); App.salvaTariffa()">
      <div class="col-md-6"><label class="form-label small">Sede</label><select class="form-select" id="ta_sede"><option value="">Tutte</option>${DB.sedi.map(s => `<option value="${s.id}">${esc(s.nome)}</option>`).join('')}</select></div>
      <div class="col-md-6"><label class="form-label small">Percorso</label><select class="form-select" id="ta_perc"><option value="">Tutti</option>${DB.percorsi.map(p => `<option value="${p.id}">${esc(p.nome)}</option>`).join('')}</select></div>
      <div class="col-md-6"><label class="form-label small">Prezzo orario (EUR)</label><input type="number" step="0.5" min="1" class="form-control" id="ta_prezzo" required></div>
      <div class="col-md-6"><label class="form-label small">Valida dal</label><input type="date" class="form-control" id="ta_dal" value="${D.add(TODAY, 10)}" required></div>
      <div class="col-12 small text-body-secondary">La tariffa precedente con la stessa sede e percorso viene chiusa il giorno prima. Le presenze già registrate non cambiano.</div>
      <div class="col-12"><div id="formErr" class="alert alert-danger small py-2 d-none"></div></div></form>`,
      `<button class="btn btn-outline-secondary" data-bs-dismiss="modal">Annulla</button><button class="btn btn-brand" type="submit" form="fTa">Salva</button>`);
  },
  salvaTariffa() {
    const sd = $('#ta_sede').value ? +$('#ta_sede').value : null, pc = $('#ta_perc').value ? +$('#ta_perc').value : null;
    const prezzo = parseFloat($('#ta_prezzo').value), dal = $('#ta_dal').value;
    if (!(prezzo > 0)) return formErr('Prezzo non valido.');
    if (prezzo > 200) return formErr('Prezzo orario insolitamente alto: controlla il valore.');
    if (!dal) return formErr('Indica la data di inizio.');
    const prev = DB.tariffe.find(t => t.sedeId === sd && t.percorsoId === pc && !t.al);
    if (prev && prev.dal >= dal) return formErr('La data deve essere successiva all\'inizio della tariffa attuale (' + D.it(prev.dal) + ').');
    if (prev) prev.al = D.add(dal, -1);
    DB.tariffe.push({ id:nextId('tariffa'), sedeId:sd, percorsoId:pc, prezzo, dal, al:null });
    audit('Modifica tariffa', `${eur(prezzo)}/ora dal ${D.it(dal)}`, sd); closeModal(); toast('Tariffa salvata'); renderMain();
  },
};
window.App = App;

/* ============================ AVVIO ============================ */
seed();
KMS.init();
renderLogin();
</script>
</body>
</html>
